# Every swappable model or engine is one value here (spec: "any model can be swapped by changing one config value").

video:
  width: 1080
  height: 1920
  fps: 30
  min_length_s: 30
  max_length_s: 45
  # auto = NVENC on the GPU laptop, x264 elsewhere | libx264 | h264_nvenc
  encoder: auto
  loudness_lufs: -14
  render_concurrency: "100%"   # Remotion: frames rendered in parallel (CPU threads)

voice:
  # edge (free, budget) or elevenlabs (production)
  engine: edge
  scene_gap_s: 0.25        # silence between scene lines
  min_scene_s: 2.0         # a scene never lasts less than this
  workers: 4               # scenes synthesised in parallel

captions:
  model: large-v3          # faster-whisper model; use "small" on CPU
  language: hi
  device: auto             # auto | cuda | cpu
  words_per_group: 3       # words shown on screen at once

characters:
  uncle_ji:
    edge_voice: hi-IN-MadhurNeural
    elevenlabs_voice_env: VOICE_ID_UNCLE_JI

youtube:
  category_id: "23"        # Comedy
  default_language: hi
  privacy: private         # stays private until the API compliance audit passes
  ai_disclosure: true
  schedule: true           # publish at the next free slot in growth/best-times.json
  playlist_id: ""          # optional series playlist (YouTube playlist ID)

writer:
  chars_per_s: 8.0         # measured Hindi TTS speed; used to estimate length before voicing
  max_scene_s: 4.5         # spec: visual change every 3-4 s
  target_max_s: 42         # Writer aims below the 45 s QA limit (real voice runs ~5% longer than the estimate)
  retries: 1               # spec: invalid output = retry once, then fail
  budget_usd: 1.0          # cap per Writer run (applies to API billing)

clips:
  # AI hero clips via fal. Empty = free mode (template animates every scene).
  # With FAL_KEY set, e.g.: [veo3.1-fast, kling-v3-pro]  (first = preferred, rest = fallbacks)
  models: []
  max_hero: 3              # spec: only 2-3 hero clips per Short (cost control)

qa:
  claude_review: true      # qa-reviewer agent scores hook / humour / safety from the opening frames
  min_humour: 7            # spec: humour 7/10 or higher to pass
  min_hook: 7

agents:
  budget_usd: 1.0          # max spend per agent run (applies to API billing)

flow:
  # Step order for each job. Change the pipeline here (no code changes needed).
  produce: [write, voice, clips, captions, render, finalize, qa, links, package]
  max_retries: 2           # spec: QA failure loops back at most 2 times, then the job is rejected

daily:
  jobs: 2                  # spec: 2 Shorts a day
  character: uncle_ji

growth:
  max_replies: 20          # comment replies posted per day
